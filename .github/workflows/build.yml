name: Build MARCH ROLE PLAY Launcher

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Generate branded application icon
        shell: pwsh
        run: ./src/MarchLauncher/make-icon.ps1
      - name: Generate city wallpaper
        shell: pwsh
        run: ./src/MarchLauncher/make-background.ps1
      - name: Publish self-contained launcher
        run: dotnet publish src/MarchLauncher/MarchLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Upload launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: MARCH-ROLE-PLAY-Launcher-win-x64
          path: publish/
          if-no-files-found: error
